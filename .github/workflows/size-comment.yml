# Post the binary size report from a pull request's build as a check on the
# commit and as a comment.
#
# This is separate from the build because a pull_request run from a fork has
# a read-only token. A workflow_run job runs from the default branch with a
# token that can comment, so it must not run anything from the pull request:
# it only reads the numbers the build uploaded and formats them with the
# script from main.

name: Size Comment

on:
  workflow_run:
    workflows: ["Build WallaBMC"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  # To publish the report as a check on the pull request's commit
  checks: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Comment
        run: |
          if ! gh run download "$RUN_ID" --repo "$REPO" --name pr-size-report --dir sizes; then
            echo "The build produced no size report"
            exit 0
          fi

          # Every build gets a check with the headline, whether or not it
          # gets a comment. The check is neutral, so it never holds up a pull
          # request, and failing to create it is not an error.
          base_sha=$(jq -r '.base_sha | strings' sizes/meta.json)
          wanted_sha=$(jq -r '.wanted_sha | strings' sizes/meta.json)
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
          python3 scripts/size_report.py compare --full \
            --head sizes/head --base sizes/base \
            --base-sha "$base_sha" --wanted-base-sha "$wanted_sha" \
            --headline headline.txt -o check.md
          jq -n --arg sha "$HEAD_SHA" --arg url "$run_url" \
            --rawfile title headline.txt --rawfile summary check.md '{
              name: "Build report",
              head_sha: $sha,
              status: "completed",
              conclusion: "neutral",
              details_url: $url,
              output: {
                title: ($title | rtrimstr("\n")),
                summary: ($summary + "\n[Build summary](" + $url + ")\n")
              }
            }' > check.json
          gh api "repos/$REPO/check-runs" --input check.json > /dev/null ||
            echo "::warning::Could not create the build report check"

          # The pull request number comes from the build, so check that it
          # names the pull request this build was for.
          pr=$(jq -r '.pr | select(type == "number") | floor' sizes/meta.json)
          if [ -z "$pr" ]; then
            echo "No pull request number in the report"
            exit 0
          fi
          pull=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.head.sha) \(.draft)"')
          if [ "${pull% *}" != "$HEAD_SHA" ]; then
            echo "Pull request $pr is not at $HEAD_SHA, not commenting"
            exit 0
          fi
          # A draft has the check, and gets the comment when it is marked
          # ready for review, which builds it again. A comment the draft
          # already has is left as it is.
          if [ "${pull#* }" = true ]; then
            echo "Pull request $pr is a draft, not commenting"
            exit 0
          fi

          python3 scripts/size_report.py compare \
            --head sizes/head --base sizes/base \
            --base-sha "$base_sha" --wanted-base-sha "$wanted_sha" \
            --run-url "$run_url" \
            -o comment.md

          # Keep one comment per pull request and update it. When the build
          # is the same as main, or close to it, the report is brief and is
          # not worth posting. The check has it. A comment from an earlier
          # push is still updated, so that it does not go on showing changes
          # that are no longer there.
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '
            .[] | select(.user.login == "github-actions[bot]") |
            select(.body | startswith("<!-- wallabmc-size-report -->")) | .id' | head -n 1)
          if [ -z "$id" ] && [ "$(sed -n 2p comment.md)" = "<!-- wallabmc-size-brief -->" ]; then
            echo "The build is close to main, not commenting"
          elif [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$pr/comments" -F body=@comment.md > /dev/null
          fi
